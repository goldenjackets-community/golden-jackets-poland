name: Deploy to S3

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_GJ }}:role/github-actions-deploy
          aws-region: us-east-1

      - name: Auto-number member cards
        run: |
          MAX=$(grep -oP '(?<=<span class="card-number">#)\d+' index.html | sort -n | tail -1)
          [ -z "$MAX" ] && MAX=0
          CHANGED=false
          while IFS= read -r line_num; do
            NEXT_LINE=$((line_num + 1))
            NEXT_CONTENT=$(sed -n "${NEXT_LINE}p" index.html)
            if echo "$NEXT_CONTENT" | grep -q 'card-number'; then
              continue
            fi
            if echo "$NEXT_CONTENT" | grep -q '<img src='; then
              MAX=$((MAX + 1))
              sed -i "${line_num}a\\        <span class=\"card-number\">#${MAX}</span>" index.html
              CHANGED=true
            fi
          done < <(grep -n 'class="member-card"' index.html | grep -v 'alumni\|challenger' | cut -d: -f1)
          if [ "$CHANGED" = true ]; then
            echo "✅ Auto-numbered new cards up to #$MAX"
          else
            echo "ℹ️ All cards already numbered"
          fi

      - name: Sync to S3
        run: |
          aws s3 sync . s3://goldenjackets.pl/ \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude "SECURITY.md"

  invalidate:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_GJ }}:role/github-actions-deploy
          aws-region: us-east-1

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

  smoke-test:
    needs: [invalidate]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CloudFront propagation
        run: sleep 30

      - name: Check site is online
        run: |
          echo "🔍 Smoke Test Starting..."
          ERRORS=0

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://goldenjackets.pl)
          echo "Main site: HTTP $HTTP"
          [ "$HTTP" = "200" ] && echo "  ✅ OK" || { echo "  ❌ FAIL"; ERRORS=$((ERRORS+1)); }

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://goldenjackets.pl/members.html)
          echo "Lounge: HTTP $HTTP"
          [ "$HTTP" = "200" ] && echo "  ✅ OK" || { echo "  ❌ FAIL"; ERRORS=$((ERRORS+1)); }

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://goldenjackets.pl/admin.html)
          echo "Admin: HTTP $HTTP"
          [ "$HTTP" = "200" ] && echo "  ✅ OK" || { echo "  ❌ FAIL"; ERRORS=$((ERRORS+1)); }

          echo ""
          if [ "$ERRORS" -eq 0 ]; then
            echo "✅ ALL SMOKE TESTS PASSED"
          else
            echo "❌ $ERRORS TEST(S) FAILED"
            exit 1
          fi
  notify-global:
    needs: [smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger global stats update
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/goldenjackets-community/golden-jackets-global/dispatches \
            -d '{"event_type":"chapter-updated"}'
          echo "✅ Global stats update triggered"
